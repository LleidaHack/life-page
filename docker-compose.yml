version: '3.8'

networks:
  proxy-tier:
    driver: bridge

services:
  frontend:
    build:
      context: ./frontend/live-page
      # NEXT_PUBLIC_* values are baked in at build time.
      args:
        # LleidaHackBackend (event operations, alerts, push, WebSocket).
        NEXT_PUBLIC_API_BASE_URL: ${LIVE_API_BASE_URL:-https://backend.main.lleidahack.dev}
        API_INTERNAL_BASE_URL: ${LIVE_API_BASE_URL:-https://backend.main.lleidahack.dev}
        NEXT_PUBLIC_TWITCH_PARENT: local
        # Optional: pin an event id; empty resolves the current HackEPS edition.
        NEXT_PUBLIC_EVENT_ID: ${LIVE_EVENT_ID:-}
        NEXT_PUBLIC_ADMIN_URL: ${LIVE_ADMIN_URL:-}
        NEXT_PUBLIC_DEVPOST_URL: ${LIVE_DEVPOST_URL:-}
    networks:
      - proxy-tier
    # do not publish frontend port to host — keep it internal only
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${LIVE_API_BASE_URL:-https://backend.main.lleidahack.dev}
      - API_INTERNAL_BASE_URL=${LIVE_API_BASE_URL:-https://backend.main.lleidahack.dev}
      - NEXT_PUBLIC_TWITCH_PARENT=local

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    networks:
      - proxy-tier
    ports:
      - "80:80"      # http (public)
      - "443:443"    # https (public)
      - "81:81"      # admin UI (public)
    volumes:
      - ./data/nginx-proxy-manager/data:/data
      - ./data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    environment:
      # optional environment variables — NPM uses sqlite DB in /data by default
      - DISABLE_IPV6=true
